name: 権利者の知らせ / Rights holder's notice
description: このリポジトリの名や文が、商標・著作権・肖像などの権利を侵していると知らせる。無償 / Notify that the name or text of this repository infringes a trademark, copyright, portrait right or other right. No fee
title: "権利: "
labels: ["権利"]
body:
  - type: markdown
    attributes:
      value: |
        扱いは名称と権利の「権利者の方へ」にあります。https://github.com/cpsbvbng26-dotcom/research-collaboration/blob/main/policies/names.md
        この issue は公開されます。本名・住所・所属・連絡先は書かない形にしています。権利と、それがどこにあるかを、問題の素材そのものを書き写さずに書く形にしています。
        公開の場で出せない知らせは、削除・訂正・開示の求めの様式で、種類に「非公開の連絡を求める」を選んで出します。https://github.com/cpsbvbng26-dotcom/research-collaboration/issues/new?template=request.yml
        書いたものは、この知らせに応じることにだけ使います。扱いは個人情報の取り扱いにあります。https://github.com/cpsbvbng26-dotcom/research-collaboration/blob/main/policies/privacy.md
        費用はかかりません。
        The handling is under "To rights holders" in Names and rights. https://github.com/cpsbvbng26-dotcom/research-collaboration/blob/main/policies/names.en.md
        This issue is public. The form asks that no real name, address, affiliation or contact details be written. It asks for the right and where the material is, without copying the material itself.
        A notice that cannot be given in public is made through the request form, with the kind "Ask for a private answer". https://github.com/cpsbvbng26-dotcom/research-collaboration/issues/new?template=request.yml
        What is written is used only to answer this notice. The handling is in Personal data. https://github.com/cpsbvbng26-dotcom/research-collaboration/blob/main/policies/privacy.en.md
        There is no fee.
  - type: dropdown
    id: kind
    attributes:
      label: どの権利か / Which right
      options:
        - 商標、または紛らわしい名 / A trademark, or a confusing name
        - 著作権 / Copyright
        - 肖像やパブリシティ / Portrait or publicity
        - そのほかの権利 / Another right
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: どこにあるか / Where
      description: このリポジトリのファイルの名か URL / A file name or URL in this repository
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: どんな権利か / What the right is
      description: 商標なら、登録番号と登録した官庁、指定する商品や役務。素材そのものは書き写さない形にしています / For a trademark, the registration number, the office, and the goods or services. The material itself is not copied
    validations:
      required: true
  - type: textarea
    id: ask
    attributes:
      label: 何を求めるか / What is asked
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: どう関わるか / Relation
      options:
        - 権利を持っている / Holds the right
        - 権利者の代理をしている / Acts for the rights holder
        - そのほか / Other
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 言語モデルに渡ること（任意） / Use of a language model (optional)
      description: |
        運営者は、このリポジトリの作業を Claude Code で行います。欄に印があれば、この issue の題と本文は、知らせを扱う手助けのために、Anthropic（米国）の言語モデル Claude に渡ることがあります。運営者は、これを個人情報保護法第28条の外国にある第三者への提供として扱います。米国の制度と Anthropic の措置は、免責事項の「issue の中身と言語モデル」の節にあります。https://github.com/cpsbvbng26-dotcom/cpsbvbng26-dotcom/blob/main/DISCLAIMER.md
        印は任意です。印が無ければ、運営者は、Claude にもほかの言語モデルにも渡さずに知らせを扱います。この issue のコメントは、言語モデルに渡しません。同意は、この issue で、いつでも撤回できます。
        The operator works on this repository with Claude Code. If the box is ticked, the title and text of this issue may be given to Claude, the language model of Anthropic (United States), to help handle the notice. The operator treats this as a provision of personal data to a third party in a foreign country under Article 28 of Japan's Act on the Protection of Personal Information. The system of the United States and Anthropic's measures are in the section "Issues and the language model" of the disclaimer. https://github.com/cpsbvbng26-dotcom/cpsbvbng26-dotcom/blob/main/DISCLAIMER.en.md
        The box is optional. Without it, the operator handles the notice without giving it to Claude or any other language model. Comments on this issue are not given to a language model. The consent can be withdrawn at any time in this issue.
      options:
        - label: この issue の題と本文を、運営者が Claude（Anthropic、米国）に渡すことに同意します。 / I consent to the operator giving the title and text of this issue to Claude (Anthropic, United States).
          required: false
